[project]
name = "kappa"
version = "0.1.0"
description = "A measuring instrument made from any camera: experiment video in, evidence-linked behavioural measurements out."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "numpy>=2.0",
  "scipy>=1.13",
  "pydantic>=2.8",
  "opencv-python-headless>=4.10",
]

[project.optional-dependencies]
api = ["openai>=1.60", "meta-sam-parser>=0.1.0", "httpx>=0.27"]

[dependency-groups]
dev = ["pytest>=8.3", "hypothesis>=6.112", "ruff>=0.7"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kappa"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
